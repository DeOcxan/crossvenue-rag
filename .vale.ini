# Prose linter for every Markdown file. Rules: docs/style.md.
# Run with `make lint-docs`, which fails on any alert at warning level or above.
# Code blocks and inline code are never linted.
StylesPath = .vale/styles
MinAlertLevel = warning
# Italic marks a term at its definition or a cited title (docs/style.md rule 33),
# which keeps its own wording.
IgnoredScopes = code, tt, em

[*.md]
BasedOnStyles = crossvenue

# Decision records and the dataset changelog record history (docs/style.md,
# rule 1), so they are exempt from the time-bound wording rule and no other.
[**/adr/*.md]
crossvenue.Timeless = NO

[**/datasets/CHANGELOG.md]
crossvenue.Timeless = NO
