   <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b6b6b" transform="translate(4.608 223.165848)">Share of the 50 comparison questions whose top 10 hold a chunk of every named venue. 95% percentile bootstrap interval over</text>
