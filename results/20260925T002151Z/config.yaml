paths:
  sources: data/sources.yaml
  manifest: data/manifest.csv
  raw: data/raw
  processed: data/processed
  index: data/index
  results: results
chunking:
  max_tokens: 450
  overlap_tokens: 60
  min_tokens: 40
  keep_code_blocks_intact: true
  max_code_block_tokens: 1200
embedding:
  model_name: BAAI/bge-base-en-v1.5
  dimension: 768
  query_prefix: 'Represent this sentence for searching relevant passages: '
  document_prefix: ''
  normalize: true
  batch_size: 32
  device: null
reranker:
  model_name: BAAI/bge-reranker-base
  top_n: 50
  batch_size: 16
retrieval:
  k: 10
  dense_candidates: 50
  bm25_candidates: 50
  rrf_k: 60
store:
  dsn: postgresql://crossvenue:crossvenue@localhost:5433/crossvenue
  table: chunks
  hnsw_m: 16
  hnsw_ef_construction: 64
  hnsw_ef_search: 100
fetch:
  request_delay_seconds: 0.5
  timeout_seconds: 30.0
  user_agent: crossvenue-rag/0.1 (research corpus builder)
  max_retries: 3
eval:
  questions: evals/datasets/v0.2-gold.jsonl
  methods:
  - bm25
  - dense
  - hybrid
  - hybrid_rerank
  - venue_split
  - venue_split_oracle
  k_values:
  - 1
  - 5
  - 10
  breakdowns:
  - venue
  - qtype
  - category
  duplicate_threshold: 0.92
  pool_depth_per_method: 20
  pool_display: 25
  paired_comparisons:
  - - hybrid_rerank
    - hybrid
  - - venue_split
    - hybrid_rerank
  - - venue_split_oracle
    - hybrid_rerank
  - - venue_split_oracle
    - venue_split
  bootstrap_resamples: 10000
  bootstrap_seed: 20260924
